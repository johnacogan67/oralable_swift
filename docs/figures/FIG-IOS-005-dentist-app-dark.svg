<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FAFAF8"/>
  <text x="40" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">FIG-IOS-005 · draft wireframe · Ed/Pedro ship patient app only</text>
  <text x="40" y="64" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">Two apps — professional app stays dark</text>
  <text x="40" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">CloudKit share and Oralable for Professionals are Phase 1+. Production CloudKit schema is not deployed.</text>

  <!-- Patient phone -->
  <rect x="80" y="120" width="280" height="500" rx="40" fill="#111111"/>
  <rect x="88" y="128" width="264" height="484" rx="32" fill="#FFFFFF"/>
  <rect x="180" y="138" width="80" height="12" rx="6" fill="#111111"/>
  <text x="108" y="178" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111">Oralable</text>
  <text x="108" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#16A34A">Shipping · Phase 0</text>
  <rect x="108" y="220" width="224" height="40" rx="8" fill="#F3F4F6"/>
  <text x="120" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Dashboard · live IR / vitals</text>
  <rect x="108" y="270" width="224" height="40" rx="8" fill="#F3F4F6"/>
  <text x="120" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Devices · pair Gen1 clip</text>
  <rect x="108" y="320" width="224" height="40" rx="8" fill="#F3F4F6"/>
  <text x="120" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Share · CSV / clinical PDF</text>
  <rect x="108" y="370" width="224" height="40" rx="8" fill="#F3F4F6"/>
  <text x="120" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Settings · placement</text>
  <text x="108" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">com.jacdental.oralable</text>
  <text x="108" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">LaunchCoordinator → MainTabView</text>
  <text x="160" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">Patient / consumer</text>

  <!-- Professional phone (greyed) -->
  <rect x="460" y="120" width="280" height="500" rx="40" fill="#4B5563"/>
  <rect x="468" y="128" width="264" height="484" rx="32" fill="#E5E7EB"/>
  <rect x="560" y="138" width="80" height="12" rx="6" fill="#6B7280"/>
  <text x="488" y="178" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6B7280">Oralable for Professionals</text>
  <text x="488" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">Phase 1+ · dark</text>
  <rect x="488" y="220" width="224" height="40" rx="8" fill="#D1D5DB"/>
  <text x="500" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Patient list</text>
  <rect x="488" y="270" width="224" height="40" rx="8" fill="#D1D5DB"/>
  <text x="500" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Add via share code / CSV</text>
  <rect x="488" y="320" width="224" height="40" rx="8" fill="#D1D5DB"/>
  <text x="500" y="344" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Participant dashboard</text>
  <rect x="488" y="370" width="224" height="56" rx="8" fill="#9CA3AF"/>
  <text x="500" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">showCloudKitShare = off</text>
  <text x="500" y="414" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#F3F4F6">Production schema not deployed</text>
  <text x="488" y="460" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">com.jacdental.oralable.professionals</text>
  <text x="488" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">ProfessionalRootView</text>
  <text x="530" y="590" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">Clinician — not for Pedro kits</text>

  <!-- Arrow -->
  <text x="800" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">CloudKit handshake</text>
  <text x="800" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">gated off</text>
  <line x1="740" y1="340" x2="820" y2="340" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="800" y="340" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="820" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Shared stack</text>
  <text x="820" y="398" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">OralableCore — BLE parse, 50 Hz,</text>
  <text x="820" y="416" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">AutomaticRecordingSession, tokens.</text>
  <text x="820" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Do not turn on professional UI for Research Kits.</text>
  <text x="820" y="480" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">See APPS_AND_REVENUE_EVAL.md</text>
  <text x="820" y="552" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">DRAFT wireframe</text>

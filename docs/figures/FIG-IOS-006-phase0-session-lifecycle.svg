  <text x="864" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">HR / SpO₂ / IR</text>

  <rect x="784" y="210" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="864" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Auto-record</text>

  <path d="M1070,240 L1070,320 L115,320 L115,240" fill="none" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <polygon points="115,240 105,252 125,252" fill="#9CA3AF"/>
  <text x="600" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Morning: clip back on case. Flash green = still charging; brief pulse ~every 10 s = hold.</text>

  <rect x="40" y="380" width="1120" height="120" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="60" y="412" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">While linked</text>
  <text x="60" y="436" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Clip LED off. Sensors run only on BLE (FW 1.0.71+). A drop stops PPG/ACC — no FIFO catch-up.</text>
  <text x="60" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Status LEDs never show red. Red/IR on-body is PPG, not a status light.</text>
  <text x="60" y="484" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">DRAFT diagram for decks. Keep Mermaid in MOBILE_APP_FLOWS.md as the editable source.</text>

  <text x="487" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">temple</text>

  <polygon points="570,200 590,190 590,210" fill="#111111"/>

  <rect x="598" y="160" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="673" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Stream</text>
  <text x="673" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">worn-gated 50 Hz</text>
  <text x="673" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">PPG + ACC</text>

  <polygon points="756,200 776,190 776,210" fill="#111111"/>


  <text x="40" y="64" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">Phase 0 session lifecycle</text>
  <text x="40" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">Oralable 4.3.3 + FW 1.0.84. Wellness wording only.</text>

  <!-- Boxes -->
  <rect x="40" y="160" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="115" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Charge</text>
  <text x="115" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">on Oralable case</text>

  <polygon points="198,200 218,190 218,210" fill="#111111"/>

  <rect x="226" y="160" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <text x="301" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Pair</text>
  <text x="301" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">or reconnect BLE</text>

  <polygon points="384,200 404,190 404,210" fill="#111111"/>

  <rect x="412" y="160" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>

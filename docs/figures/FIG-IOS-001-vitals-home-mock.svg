<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#FAFAF8"/>
  <text x="40" y="36" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">FIG-IOS-001 · draft wireframe · Oralable 4.3.3 · Phase 0</text>
  <text x="40" y="64" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">Dashboard — Vitals home</text>
  <text x="40" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">No Start button. Recording starts when BLE is ready and worn. Wellness only.</text>

  <!-- Phone chrome -->
  <rect x="48" y="110" width="280" height="540" rx="40" fill="#111111"/>
  <rect x="56" y="118" width="264" height="524" rx="32" fill="#FFFFFF"/>
  <rect x="148" y="128" width="80" height="12" rx="6" fill="#111111"/>

  <!-- Nav -->
  <text x="72" y="168" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111">Dashboard</text>
  <circle cx="292" cy="162" r="12" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>

  <!-- TFI / SASHB strip -->
  <rect x="72" y="184" width="110" height="48" rx="8" fill="#F3F4F6"/>
  <text x="80" y="204" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6B7280">TFI</text>
  <text x="80" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111">12%</text>
  <rect x="190" y="184" width="110" height="48" rx="8" fill="#F3F4F6"/>
  <text x="198" y="204" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6B7280">SASHB</text>
  <text x="198" y="222" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111">0.4 /h</text>

  <!-- VitalsDeviceStatusCard -->
  <rect x="72" y="242" width="228" height="148" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="86" cy="262" r="5" fill="#16A34A"/>
  <text x="98" y="266" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Vitals ready</text>
  <text x="248" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B7280">87%</text>
  <text x="84" y="284" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6B7280">Temple · quality-gated HR / SpO₂</text>
  <rect x="84" y="294" width="40" height="16" rx="4" fill="#F3F4F6"/>
  <text x="90" y="305" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#6B7280">Dock</text>
  <rect x="128" y="294" width="52" height="16" rx="4" fill="#F3F4F6"/>
  <text x="134" y="305" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#6B7280">Charge</text>
  <rect x="184" y="294" width="42" height="16" rx="4" fill="#DCFCE7"/>
  <text x="190" y="305" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16A34A">Worn</text>
  <text x="84" y="338" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6B7280">Heart rate</text>
  <text x="84" y="360" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">72</text>
  <text x="118" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">BPM</text>
  <text x="84" y="374" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16A34A">Good signal</text>
  <text x="200" y="338" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#6B7280">SpO₂</text>
  <text x="200" y="360" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">97</text>
  <text x="236" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">%</text>
  <text x="200" y="374" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16A34A">Good signal</text>

  <!-- Overnight morning card -->
  <rect x="72" y="400" width="228" height="72" rx="10" fill="#F3F4F6"/>
  <text x="84" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111">Last night</text>
  <rect x="84" y="426" width="60" height="20" rx="4" fill="#FFFFFF"/>
  <text x="90" y="440" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16A34A">Jaw Low</text>
  <rect x="148" y="426" width="56" height="20" rx="4" fill="#FFFFFF"/>
  <text x="154" y="440" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#CA8A04">O2 Mod</text>
  <rect x="208" y="426" width="80" height="20" rx="4" fill="#FFFFFF"/>
  <text x="214" y="440" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#16A34A">Rescue Low</text>
  <polyline points="84,462 100,458 116,464 132,450 148,456 164,448 180,460 196,452 212,458 228,454 244,458 280,456" fill="none" stroke="#111111" stroke-width="1.4"/>

  <!-- PPG card -->
  <rect x="72" y="480" width="228" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="84" y="500" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">PPG Sensor</text>
  <text x="84" y="522" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7C3AED">IR</text>
  <text x="108" y="522" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6B7280">Oralable IR  ▸</text>
  <polyline points="200,512 208,506 216,518 224,500 232,514 240,508 248,516 256,504 264,512 272,508" fill="none" stroke="#7C3AED" stroke-width="1.5"/>

  <!-- Tab bar -->
  <rect x="56" y="592" width="264" height="50" fill="#FAFAFA"/>
  <line x1="56" y1="592" x2="320" y2="592" stroke="#E5E7EB" stroke-width="1"/>
  <text x="78" y="624" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#111111">Dashboard</text>
  <text x="148" y="624" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#9CA3AF">Devices</text>
  <text x="208" y="624" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#9CA3AF">Share</text>
  <text x="262" y="624" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#9CA3AF">Settings</text>

  <!-- Callouts -->
  <line x1="328" y1="262" x2="380" y2="200" stroke="#9CA3AF" stroke-width="1"/>
  <text x="388" y="196" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">VitalsDeviceStatusCard</text>
  <text x="388" y="216" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">HR / SpO₂ live here when connected.</text>
  <text x="388" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Separate HR/SpO₂ cards stay flag-off.</text>

  <line x1="328" y1="430" x2="380" y2="300" stroke="#9CA3AF" stroke-width="1"/>
  <text x="388" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">OvernightMorningCardView</text>
  <text x="388" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Band chips + state hypnogram (FIG-CO-025 layout).</text>
  <text x="388" y="334" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">In-app bands unlock at ≥1 h worn. Not a diagnosis.</text>

  <line x1="328" y1="508" x2="380" y2="380" stroke="#9CA3AF" stroke-width="1"/>
  <text x="388" y="376" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">PPG IR card — always on</text>
  <text x="388" y="396" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">Tap opens HistoricalView (IR Activity).</text>

  <rect x="388" y="430" width="760" height="180" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="408" y="458" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">What this screen is for</text>
  <text x="408" y="484" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">Temple vitals on Oralable Gen1 (REV10, FW 1.0.84). Clip LED off while linked.</text>
  <text x="408" y="508" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">AutomaticRecordingSession owns the night — pause on drop, resume on reconnect.</text>
  <text x="408" y="532" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111111">Source: DashboardView + HomeView. Ed/Pedro ship this patient app only.</text>
  <text x="408" y="572" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">DRAFT wireframe from SwiftUI — replace with a screenshot when TestFlight art is ready.</text>
</svg>

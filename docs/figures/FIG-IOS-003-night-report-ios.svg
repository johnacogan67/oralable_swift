  <!-- Notes -->
  <rect x="640" y="120" width="520" height="500" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="664" y="156" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111">What ships vs what the PDF adds</text>
  <text x="664" y="192" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">In app (flag showOvernightHypnogram)</text>
  <text x="664" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Band chips + StateHypnogramView on Dashboard and Share.</text>
  <text x="664" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Bands unlock at ≥1 h worn. Under that: “Need ≥1 hour…”</text>
  <text x="664" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Clinical PDF (Share)</text>
  <text x="664" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">KPIs → bout hypnogram → hourly stack → IR-DC/SpO₂ rail → events.</text>
  <text x="664" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Evaluable overnight (cohort / Paper A)</text>
  <text x="664" y="350" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">≥6 h worn (goal 8 h). Do not mix with the 1 h in-app gate.</text>
  <text x="664" y="386" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111">Wording</text>
  <text x="664" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111111">Low / Moderate / High — not a sleep score, not AHI, not diagnosis.</text>
  <text x="664" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">OvernightNightReportBuilder · ClinicalReportGenerator</text>
  <text x="664" y="580" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF">DRAFT wireframe — screenshot still open for FIG-IOS-003.</text>

name: iOS build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.scheme }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme:
          - MAMDiagnostics
          - OralableForProfessionals

    steps:
      - name: Check out the iOS application
        uses: actions/checkout@v4

      # The Xcode project has an XCLocalSwiftPackageReference at ../../OralableCore
      # relative to OralableApp/. Keep the checked-out dependency inside the
      # GitHub workspace, then expose the expected sibling path with a symlink.
      - name: Check out the pinned OralableCore package
        uses: actions/checkout@v4
        with:
          repository: johnacogan67/OralableCore
          ref: c3e7617
          path: OralableCore

      - name: Provide the sibling Core package path expected by Xcode
        run: |
          set -euo pipefail
          expected_path="$GITHUB_WORKSPACE/../OralableCore"
          test ! -e "$expected_path"
          ln -s "$GITHUB_WORKSPACE/OralableCore" "$expected_path"
          test -f "$expected_path/Package.swift"

      - name: Verify the workspace and local package layout
        working-directory: OralableApp
        run: |
          set -euo pipefail
          test -f ../../OralableCore/Package.swift
          test -f OralableWorkspace.xcworkspace/contents.xcworkspacedata
          xcodebuild -list -workspace OralableWorkspace.xcworkspace

      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          simulator_name="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            iphone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
            abort "No available iPhone simulator" unless iphone
            puts iphone.fetch("name")
          ')"
          echo "SIMULATOR_NAME=${simulator_name}" >> "$GITHUB_ENV"
          echo "Using simulator: ${simulator_name}"

      - name: Resolve package dependencies
        working-directory: OralableApp
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace OralableWorkspace.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/oralable-source-packages"

      - name: Build and test
        working-directory: OralableApp
        run: |
          set -euo pipefail
          xcodebuild test \
            -workspace OralableWorkspace.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/oralable-source-packages" \
            -resultBundlePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-xcresult
          path: ${{ runner.temp }}/${{ matrix.scheme }}.xcresult
          if-no-files-found: warn
          retention-days: 14
